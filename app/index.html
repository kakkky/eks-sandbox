<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
  </head>
  <body>
    <h1>Todo List</h1>
    <form method="POST" action="/todos">
      <input type="text" name="title" placeholder="New Todo" required />
      <button type="submit">Add</button>
    </form>
    <ul>
      {{range .}}
      <li>{{.Title}}</li>
      {{else}}
      <li></li>
      {{end}}
    </ul>
  </body>
</html>
