deployment:
  name: myapp
  replicaCount: 1
  nodeSelector:
    role: myapp
  image:
    repository: myrepo/myapp
    tag: "latest"
  containerPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nginx:
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

service:
  type: NodePort
  port: 8080
  nodePort: 30080
