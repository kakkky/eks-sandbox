# Deployment settings
deployment:
  name: myapp
  replicaCount: 2
  # Application container image
  image:
    repository: myapp
    tag: "latest"
  
  # Application container port
  containerPort: 8080
  
  # Application container resources
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  # Nginx sidecar resources
  nginx:
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

# Horizontal Pod Autoscaler settings
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCpuUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Service settings
service:
  type: NodePort
  nodePort: 30080
