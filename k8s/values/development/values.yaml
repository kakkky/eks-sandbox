deployment:
  name: app
  replicaCount: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 25%
  image:
    repository: app
    tag: "local"
  containerPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nginx:
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCpuUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

service:
  type: NodePort
  nodePort: 30080
